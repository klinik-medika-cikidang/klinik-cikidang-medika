deployment:
  platform: Vercel
  production_url: https://klinik-cikidang-medika.vercel.app
  repository: https://github.com/klinik-medika-cikidang/klinik-cikidang-medika
  visibility: public
  last_successful_commit: d8a0aeb
  note: "Deployment produksi gagal dari 27 Sep sampai 1 Okt pagi (domain masih menyajikan kode era F-004) dan kembali berhasil setelah repo dipindahkan ke organisasi klinik-medika-cikidang."
  verified_routes: ["/", "/login", "/pendaftaran", "/rekam-medis", "/program-khusus", "/buku-kas", "/laporan"]

auth:
  accounts_production:
    - "owner@cikidangmedika.com (owner)"
    - "dokter@cikidangmedika.com (dokter_admin)"
  accounts_staging:
    - "owner@cikidangmedika.com (owner)"
    - "dokter@cikidangmedika.com (dokter_admin)"
    - "kasir@cikidangmedika.com (sisa peran lama, perlu ditinjau)"
  password_source: "SEED_PASSWORD_OWNER dan SEED_PASSWORD_DOKTER di .env.staging, .env.production, dan .env.local; semuanya gitignored"
  password_policy: "satu kata sandi per akun, minimal 12 karakter, skrip menolak jika ada dua akun bernilai sama"
  password_style: "Pola kata yang mudah diketik staf klinik, dipilih atas permintaan pemilik setelah kata sandi acak dikeluhkan. Ketahanan terhadap tebakan menurun, dan alamat email akun juga mudah ditebak; jangan pernah menuliskan nilainya ke berkas tracked karena repo ini publik."
  reset_path: "node scripts/seed-auth-users.mjs --env=.env.production --confirm-prod --rotate, atau Supabase Dashboard"
  email_reset_available: false

pwa:
  manifest: src/app/manifest.ts
  service_worker: public/sw.js
  offline_page: src/app/offline/page.tsx
  icons_generated_by: scripts/generate_pwa_icons.py
  cache_policy: "Hanya /_next/static/ dan /assets/ yang di-cache. Halaman HTML dan respons Supabase sengaja tidak pernah di-cache, karena halaman berisi data pasien yang tersimpan bisa terbaca pengguna perangkat berikutnya."
  note: "Tidak ada berkas emblem terpisah di repositori, sehingga mark daun diekstrak dari lockup berdasarkan hue. Ada cacat kecil di ujung daun kanan bawah karena wordmark menempel di sana; ganti PWA_ICON_SOURCE bila klinik menyediakan berkas emblem resmi."

