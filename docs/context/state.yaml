blockers: []
risks:
  - "Sebagian besar catatan lama tidak mengisi metode pembayaran (hanya 158 dari 7.493 baris), sehingga sisanya dikategorikan Tunai."
  - "Sebagian besar pasien lama belum memiliki NIK maupun nomor BPJS (2.670 dari 4.238 pasien). Ini keterbatasan data sumber, bukan kehilangan data saat migrasi."
  - "Kolom header CSV nomor 22 berlabel 'Biaya' namun berisi penjamin, dan nomor 23 berlabel 'Pendapatan' namun berisi tarif. Indeks skrip migrasi sudah cocok dengan isi data, tetapi label spreadsheet sumber perlu dirapikan."
  - "Produksi awalnya dibuat dengan kolom bertipe TEXT yang longgar sehingga nilai seperti 'UMUM' bisa tersimpan pada kolom jam. Tipe kolom sudah diselaraskan dengan skema kanun melalui supabase/migrations/20260927_prod_schema_type_alignment.sql."
  - "Satu nilai no_bpjs pada baris CSV 4859 dikosongkan karena strukturnya bukan nomor BPJS."
  - "Pemetaan desa legacy (Tamansari, Gunungmalang, Bumiasih, Nangerang) tetap ada di konstanta sebagai pengaman, namun audit CSV membuktikan nama tersebut tidak dipakai pada data nyata."
  - "F-009: nilai No RM 10 digit (280 baris), 7 digit (4), 5 digit (2), dan satu nilai non-numerik tidak ditulis ulang karena parser yang bisa melakukannya menggabungkan rekaman yang belum tentu orang yang sama. Nilai tersebut dilaporkan untuk ditinjau klinik."
  - "F-009: register sirkumsisi belum dapat dibentuk karena sheet SUNAT tidak punya kolom tanggal tindakan dan kolom tanggal_tindakan bersifat NOT NULL. Data anak sudah dibuat atau dilengkapi; tanggal tindakan menunggu konfirmasi klinik."
  - "F-009: verifikasi responsif 360/768/1024 px dan navigasi keyboard dilakukan lewat inspeksi kode dan build, belum lewat peramban."
  - "F-009: dua baris register 3 Eliminasi ditulis ulang setiap kali skrip dijalankan (nilainya identik), karena dua berkas skrining menargetkan kunjungan yang sama."
  - "F-009: 43 baris register sirkumsisi diimpor tanpa tanggal tindakan (NULL) karena sheet SUNAT tidak punya kolomnya. Baris tersebut tampil paling atas di daftar sunat dan dilengkapi klinik lewat form edit."
  - "F-009: tanggal tindakan untuk 13 dari 43 baris register sirkumsisi sebenarnya dapat dipulihkan dari log kunjungan (diagnosa 'Routine/ritual circumcision' atau anamnesa 'sunat'), masing-masing tepat satu kunjungan. Satu di antaranya adalah kunjungan kontrol H+3, bukan tindakan itu sendiri. Pemulihan ditawarkan sebagai opsi prefill (F-009-OPEN-004) dan belum diterapkan otomatis karena ini menyentuh isi rekam medis."
  - "F-009: dari 287 nomor RM tidak beraturan, 280 adalah nomor 10 digit asli klinik dan bukan kesalahan migrasi. Enam nomor pendek (4 berisi 7 digit, 2 berisi 5 digit) dapat dipadankan ke 9 digit tanpa bentrok, dan satu nilai berisi teks 'gatal gatal'."
  - "F-009: 9 baris sirkumsisi membawa catatan verifikasi (4 nama berbeda dari nama pasien, 5 bentrok tanggal lahir). Satu pasien baru dibuat untuk baris yang tanggal lahirnya sudah dipakai pasien bernama lain, agar tidak menempelkan tindakan ke anak yang salah."
  - "F-009: ditemukan satu pasien dengan nama literal 'J00' (kode ICD-10 masuk ke kolom nama). Dibiarkan apa adanya dan dilaporkan; klinik yang memutuskan perbaikan atau penggabungan."
  - "F-009: 3 baris circumcisions tanpa sumber_data hanya ada di staging, dibuat serentak 2026-09-26 17:02 dari pemulihan data program F-006, biaya dan metode identik (Rp750.000, Laser/Kauter), dan memakai No RM berformat aplikasi. Produksi memiliki 0 baris circumcisions. Baris ini tidak ikut terbawa oleh reconcile-clinic-data.mjs, tetapi tampil di UI staging. Identitas pasien pada baris ini tidak ditulis di dokumen repo karena bersifat PII."
  - "F-009: register sirkumsisi mengandung nama ganda di sumber. Satu baris register punya dua pasien bernama sama dan bertanggal lahir identik, satu baris lain punya tiga pasien bernama sama. Baris register hanya tercatat pada satu pasien. Penggabungan identitas pasien kembar ini menunggu keputusan klinik, karena normalisasi No RM tidak dapat membuktikan keduanya orang yang sama."
  - "F-009: rekonsiliasi sempat tidak idempoten. Pencocokan nama pada register sirkumsisi memakai elemen pertama dari daftar pasien yang dikembalikan PostgREST tanpa ORDER BY, sehingga urutan baris menentukan pasien mana yang dipilih. Produksi merencanakan baris sirkumsisi ke-44 saat dijalankan ulang. Sudah diperbaiki pada commit 5a0e0ef dengan kunci deterministik (pasien terdaftar, lalu tanggal lahir, lalu No RM terkecil); staging dan produksi kini melaporkan 0 rencana perubahan."

